<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>感谢支持 - Lucky Pick</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #fef6f9 0%, #f0ecfa 50%, #f5ecf8 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      padding: 20px;
    }

    .card {
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(124, 111, 190, .15), 0 0 0 1px rgba(196, 122, 176, .08);
      padding: 40px 36px 32px;
      text-align: center;
      max-width: 380px;
      width: 100%;
      animation: fadeUp .5s ease-out both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .emoji-top {
      font-size: 48px;
      line-height: 1;
      margin-bottom: 12px;
      animation: bounce 2s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-6px); }
    }

    .title {
      font-size: 22px;
      font-weight: 900;
      background: linear-gradient(135deg, #7c6fbe, #c47ab0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 13px;
      color: #8e7aaa;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .qr-wrap {
      display: inline-block;
      padding: 12px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(124,111,190,.08), rgba(232,139,168,.08));
      border: 1.5px solid rgba(196,122,176,.12);
      margin-bottom: 24px;
    }

    .qr-wrap img {
      display: block;
      width: 220px;
      height: 220px;
      border-radius: 10px;
      object-fit: contain;
    }

    .tip {
      font-size: 13px;
      color: #b8aec8;
      line-height: 1.6;
    }

    .tip .highlight {
      color: #07c160;
      font-weight: 800;
    }

    .footer {
      margin-top: 20px;
      font-size: 11px;
      color: #d4c8d8;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji-top">🎉</div>
    <div class="title">感谢你的支持！</div>
    <div class="subtitle">你的鼓励是我持续更新的最大动力 ❤️</div>
    <div class="qr-wrap">
      <img src="icons/赞赏码.png" alt="微信赞赏码">
    </div>
    <div class="tip">
      打开 <span class="highlight">微信</span>，扫描二维码即可完成赞赏
    </div>
    <div class="footer">Lucky Pick · 选择困难症小助手</div>
  </div>
</body>
</html>
