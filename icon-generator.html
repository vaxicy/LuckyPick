<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>生成图标</title></head>
<body style="font-family:sans-serif;padding:30px;max-width:600px;margin:auto;background:#f5f7fa;">
<h1 style="margin-bottom:8px">🎲 LuckyPick 图标生成器</h1>
<p style="color:#666;font-size:14px;margin-bottom:20px">点击下方按钮生成 3 个 PNG 图标，放入 <code>icons/</code> 文件夹后重新加载扩展。</p>

<div id="previews" style="display:flex;gap:24px;flex-wrap:wrap;background:#fff;padding:20px;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:16px;"></div>

<div style="display:flex;gap:10px;flex-wrap:wrap">
<button onclick="downloadAll()" style="padding:12px 28px;border:none;border-radius:10px;background:#22c55e;color:#fff;font-size:15px;font-weight:700;cursor:pointer">⬇ 一键生成全部 (Download All)</button>
<button onclick="dl(16)" style="padding:10px 18px;border:none;border-radius:8px;background:#4f46e5;color:#fff;cursor:pointer;font-size:13px">下载 16x16</button>
<button onclick="dl(48)" style="padding:10px 18px;border:none;border-radius:8px;background:#4f46e5;color:#fff;cursor:pointer;font-size:13px">下载 48x48</button>
<button onclick="dl(128)" style="padding:10px 18px;border:none;border-radius:8px;background:#4f46e5;color:#fff;cursor:pointer;font-size:13px">下载 128x128</button>
</div>

<div id="status" style="margin-top:14px;padding:10px 14px;border-radius:8px;display:none;font-size:13px"></div>

<script>
var S=[16,48,128];
var cvs={};

function init(){
  var area=document.getElementById('previews');
  S.forEach(function(s){
    var c=document.createElement('canvas');
    c.width=s;c.height=s;
    c.id='c'+s;
    drawIcon(c,s);
    cvs[s]=c;
    area.innerHTML+=
      '<div style="text-align:center"><canvas id="c'+s+'" width="'+s+'" height="'+s+'" style="border-radius:6px;border:2px solid #e5e7eb;display:block;margin-bottom:4px"></div>'+
      '<span style="color:#888;font-size:12px">'+s+'×'+s+'</span></div>';
    // re-draw after append
    drawIcon(document.getElementById('c'+s),s);
  });
}
function drawIcon(c,s){
  var ctx=c.getContext('2d');
  var r=Math.round(s*.2);
  ctx.clearRect(0,0,s,s);
  // bg gradient
  var g=ctx.createLinearGradient(0,0,s,s);
  g.addColorStop(0,'#4f46e5');g.addColorStop(1,'#7c3aed');
  // rounded rect
  ctx.beginPath();
  ctx.moveTo(r,0);ctx.lineTo(s-r,0);ctx.quadraticCurveTo(s,0,s,r);
  ctx.lineTo(s,s-r);ctx.quadraticCurveTo(s,s,s-r,s);
  ctx.lineTo(r,s);ctx.quadraticCurveTo(0,s,0,s-r);
  ctx.lineTo(0,r);ctx.quadraticCurveTo(0,0,r,0);
  ctx.closePath();
  ctx.fillStyle=g;ctx.fill();
  // text
  ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';
  var fz=s<=16?Math.round(s*.6):s<=48?Math.round(s*.45):Math.round(s*.38);
  ctx.font=fz+'px "Segoe UI Emoji","Apple Color Emoji",Arial';
  ctx.fillText('🎲',s/2,s/2+(s<=16?.5:0));
}
function dl(size){
  var c=document.getElementById('c'+size);
  if(!c){drawIcon(cvs[size],size);c=cvs[size];}
  var a=document.createElement('a');
  a.download='icon'+size+'.png';
  a.href=c.toDataURL('image/png');
  a.click();
  ok('✅ 已下载 icon'+size+'.png');
}
function downloadAll(){
  var n=0;
  S.forEach(function(s,i){
    setTimeout(function(){dl(s);n++;if(n===S.length)ok('✅ 全部下载完成！请放入 icons/ 文件夹后重试。')},i*300);
  });
}
function ok(m){
  var el=document.getElementById('status');
  el.textContent=m;
  el.style.cssText='background:#dcfce7;color:#15803d;display:block';
}
init();
</script>
</body>
</html>
