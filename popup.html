<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=320">
  <title>Lucky Pick - 选择困难症小帮手</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-dice">&#127922;</span>
      <span id="app-name">LuckyPick</span>
    </div>
    <div class="top-actions">
      <button id="btn-history" class="icon-btn" type="button" data-i18n-title="history_tip" title="History">&#128203;</button>
      <button id="btn-settings" class="icon-btn" type="button" data-i18n-title="settings_tip" title="Settings">&#9881;</button>
    </div>
  </header>

  <main class="main">
    <section id="input-section" class="input-section">
      <section class="options-box">
        <div id="options-list" class="options-list">
          <div class="option-row">
            <span class="badge">A</span>
            <input class="option-input" data-i18n-placeholder="opt_placeholder_a" placeholder="Option A..." autofocus>
            <button class="delete-btn" type="button">&times;</button>
          </div>
          <div class="option-row">
            <span class="badge">B</span>
            <input class="option-input" data-i18n-placeholder="opt_placeholder_b" placeholder="Option B...">
            <button class="delete-btn" type="button">&times;</button>
          </div>
        </div>
        <button id="btn-add-option" class="add-btn" type="button" data-i18n="add_option">+ Add option</button>
      </section>

      <button id="btn-roll" class="roll-btn" type="button" data-i18n="roll_btn">&#127922; Roll dice</button>
    </section>

    <section id="battle-section" class="battle-section hidden">
      <div class="battle-title" data-i18n="battle_title">Rolling...</div>
      <div id="dice-stage" class="dice-stage"></div>
      <div class="progress-track"><div id="progress-bar" class="progress-bar"></div></div>
    </section>

    <section id="result-section" class="result-section hidden">
      <div id="confetti-container" class="confetti-container"></div>
      <div class="result-card">
        <div class="result-kicker" data-i18n="winner_label">Result</div>
        <div id="result-winner" class="result-winner"></div>
        <div id="result-msg" class="result-msg"></div>
      </div>
      <div id="result-dice-visual" class="result-dice-visual"></div>
      <div class="result-actions">
        <button id="btn-again" class="action-btn primary" type="button" data-i18n="again">Again</button>
        <button id="btn-export" class="action-btn" type="button" data-i18n="export_btn">Export image</button>
      </div>
    </section>
  </main>

  <div id="panel-overlay" class="overlay hidden"></div>

  <aside id="history-panel" class="panel hidden">
    <div class="panel-head">
      <h2 data-i18n="history_title">History</h2>
      <button id="btn-close-history" class="close-btn" type="button"><span class="close-mark">&times;</span></button>
    </div>
    <div id="history-list" class="panel-body"></div>
    <div class="panel-foot">
      <button id="btn-clear-history" class="text-btn" type="button" data-i18n="clear_history">Clear history</button>
    </div>
  </aside>

  <aside id="settings-panel" class="panel hidden">
    <div class="panel-head">
      <h2 data-i18n="settings_title">Settings</h2>
      <button id="btn-close-settings" class="close-btn" type="button"><span class="close-mark">&times;</span></button>
    </div>
    <div class="panel-body settings-body">
      <div class="setting-row">
        <span data-i18n="mode_label">Mode</span>
        <div id="set-mode" class="segmented small mode-segmented">
          <button class="seg-btn active" type="button" data-value="dice" data-i18n="mode_dice">Dice</button>
          <button class="seg-btn" type="button" data-value="coin" data-i18n="mode_coin">Coin</button>
          <button class="seg-btn" type="button" data-value="wheel" data-i18n="mode_wheel">Wheel</button>
        </div>
      </div>
      <div class="setting-row">
        <span data-i18n="language">Language</span>
        <div id="set-lang" class="segmented small">
          <button class="seg-btn active" type="button" data-value="zh">&#20013;&#25991;</button>
          <button class="seg-btn" type="button" data-value="en">EN</button>
        </div>
      </div>
      <div class="setting-row">
        <span data-i18n="theme_label">Dark mode</span>
        <button id="set-theme" class="toggle" type="button" aria-label="Theme"></button>
      </div>
      <div class="setting-row">
        <span data-i18n="incognito_label">Incognito</span>
        <button id="set-incognito" class="toggle" type="button" aria-label="Incognito"></button>
      </div>
      <div class="setting-row">
        <span data-i18n="animation_speed">Animation</span>
        <div id="set-speed" class="segmented small">
          <button class="seg-btn active" type="button" data-value="normal" data-i18n="speed_normal">Normal</button>
          <button class="seg-btn" type="button" data-value="fast" data-i18n="speed_fast">Fast</button>
          <button class="seg-btn" type="button" data-value="slow" data-i18n="speed_slow">Slow</button>
        </div>
      </div>
    </div>
  </aside>

  <div id="confirm-overlay" class="overlay hidden"></div>
  <div id="confirm-dialog" class="confirm-dialog hidden">
    <div class="confirm-icon">!</div>
    <div id="confirm-msg" class="confirm-msg"></div>
    <div class="confirm-actions">
      <button id="confirm-cancel" class="confirm-btn" type="button" data-i18n="confirm_cancel">Cancel</button>
      <button id="confirm-ok" class="confirm-btn ok" type="button" data-i18n="confirm_ok">OK</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
