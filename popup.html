<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=320">
  <title>LuckyPick</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <!-- Header -->
  <header class="hd">
    <div class="hd-left"><span class="logo">🎲</span><span class="app-name" id="app-name">LuckyPick</span></div>
    <div class="hd-right">
      <button class="ib" id="btn-history" data-i18n-title="history_tip" title="历史">📋</button>
      <button class="ib" id="btn-settings" data-i18n-title="settings_tip" title="设置">⚙️</button>
    </div>
  </header>

  <!-- Mode Tabs -->
  <div class="mode-tabs">
    <button class="mt-btn active" data-mode="dice" id="tab-dice">🎲 摇骰子</button>
    <button class="mt-btn" data-mode="coin" id="tab-coin">🪙 抛硬币</button>
    <button class="mt-btn" data-mode="wheel" id="tab-wheel">🎡 转盘</button>
    <button class="mt-btn" data-mode="number" id="tab-number">🎴 幸运数字</button>
  </div>

  <main class="main">

    <!-- 输入区 -->
    <section id="input-section">
      <!-- Options input (dice/coin/wheel) -->
      <div id="options-wrap">
        <div class="opt-list" id="options-list">
          <div class="row"><span class="badge" style="background:#E88BA8">A</span><input class="inp" data-i18n-placeholder="opt_placeholder_a" placeholder="选项 A..." autofocus><button class="del">×</button></div>
          <div class="row"><span class="badge" style="background:#6BAFE0">B</span><input class="inp" data-i18n-placeholder="opt_placeholder_b" placeholder="选项 B..."><button class="del">×</button></div>
        </div>
        <button class="add-btn" id="btn-add-option" data-i18n="add_option">＋ 添加选项</button>
      </div>

      <!-- Number range input (number mode) -->
      <div id="number-wrap" class="hidden">
        <div class="num-range-row">
          <span class="num-label" data-i18n="num_from">从</span>
          <input type="number" class="num-inp" id="num-min" value="1" min="1" max="9999">
          <span class="num-label" data-i18n="num_to">到</span>
          <input type="number" class="num-inp" id="num-max" value="10" min="1" max="9999">
        </div>
      </div>

      <button class="go-btn" id="btn-roll" data-i18n="roll_btn">🎲 掷骰对决</button>
    </section>

    <!-- 动画区 -->
    <section class="battle hidden" id="battle-section">
      <div class="battle-tip" data-i18n="battle_title">掷骰中...</div>
      <div class="stage" id="dice-stage"></div>
      <div class="bar-track"><div class="bar-fill" id="progress-bar"></div></div>
    </section>

    <!-- 结果区 -->
    <section class="result hidden" id="result-section">
      <div class="confetti-wrap" id="confetti-container"></div>
      <div class="winner-card">
        <div class="wlbl" data-i18n="winner_label">获胜者</div>
        <div class="wname" id="result-winner"></div>
      </div>
      <div class="dice-visual" id="result-dice-visual"></div>
      <div class="wmsg" id="result-msg"></div>
      <div class="acts">
        <button class="ab ab-main" id="btn-again" data-i18n="again">再来一局</button>
        <button class="ab" id="btn-copy-text" data-i18n="copy_text_btn">📋 复制</button>
        <button class="ab" id="btn-export" data-i18n="export_btn">📸 导出</button>
      </div>
    </section>

  </main>

  <!-- 底部幸运 -->
  <footer class="ft" id="footer-lucky">
    <div class="lucky-card">
      <span class="lucky-icon">🍀</span>
      <span class="lucky-tip" id="lucky-tip"></span>
    </div>
  </footer>

  <!-- 确认弹窗 -->
  <div class="confirm-overlay hidden" id="confirm-overlay"></div>
  <div class="confirm-dialog hidden" id="confirm-dialog">
    <div class="confirm-icon">⚠️</div>
    <div class="confirm-msg" id="confirm-msg"></div>
    <div class="confirm-actions">
      <button class="confirm-btn confirm-cancel" id="confirm-cancel" data-i18n="confirm_cancel">取消</button>
      <button class="confirm-btn confirm-ok" id="confirm-ok" data-i18n="confirm_ok">确定</button>
    </div>
  </div>

  <!-- 历史面板 -->
  <div class="ov hidden" id="panel-overlay"></div>
  <aside class="panel hidden" id="history-panel">
    <div class="ph"><h2 data-i18n="history_title">📋 历史记录</h2><button class="cb" id="btn-close-panel">✕</button></div>
    <div class="pb" id="history-list"><div class="pe" data-i18n="history_empty">暂无记录</div></div>
    <div class="pf"><button class="clrb" id="btn-clear-history" data-i18n="clear_history">清空历史</button></div>
  </aside>

  <!-- 设置面板 -->
  <aside class="panel hidden" id="settings-panel">
    <div class="ph"><h2 data-i18n="settings_title">⚙️ 设置</h2><button class="cb" id="btn-close-settings">✕</button></div>
    <div class="pb spb">
      <div class="sg">
        <span class="sgi">🌐</span><span class="sgl" data-i18n="language">语言 / Language</span>
        <div class="seg" id="set-lang">
          <button class="seg-btn active" data-v="zh">中文</button>
          <button class="seg-btn" data-v="en">English</button>
        </div>
      </div>
      <div class="sg">
        <span class="sgi">🎨</span><span class="sgl" data-i18n="theme_label">深色模式</span>
        <div class="tgl" id="set-theme"></div>
      </div>
      <div class="sg">
        <span class="sgi">🕶️</span><span class="sgl" data-i18n="incognito_label">无痕模式</span>
        <div class="tgl" id="set-incognito"></div>
      </div>
      <div class="sg">
        <span class="sgi">🏆</span><span class="sgl" data-i18n="rule_label">默认规则</span>
        <div class="seg" id="set-rule">
          <button class="seg-btn active" data-v="high" data-i18n="rule_high">大者胜</button>
          <button class="seg-btn" data-v="low" data-i18n="rule_low">小者胜</button>
        </div>
      </div>
      <div class="sg">
        <span class="sgi">⚡</span><span class="sgl" data-i18n="anim_speed_label">动画速度</span>
        <div class="seg set-speed">
          <button class="seg-btn active" data-v="normal" data-i18n="anim_speed_normal">正常</button>
          <button class="seg-btn" data-v="fast" data-i18n="anim_speed_fast">快速</button>
          <button class="seg-btn" data-v="slow" data-i18n="anim_speed_slow">慢速</button>
        </div>
      </div>
    </div>
  </aside>

  <script src="popup.js"></script>
</body>
</html>
